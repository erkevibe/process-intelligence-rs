# Drop-in for the distribution's existing caddy.service, after reviewing its paths.
[Service]
EnvironmentFile=/etc/process-intelligence/caddy-environment
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
ExecReload=
# Caddy's admin listener is disabled. Reload via a controlled service restart.
