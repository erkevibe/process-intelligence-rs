name: Rust contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    services:
      quality-postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: pi_s21_app
          POSTGRES_PASSWORD: sprint25-ci-only
          POSTGRES_DB: pi_s25_quality_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi_s21_app -d pi_s25_quality_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Sprint27 prospective miner comparison portable evidence replay
        run: python3 -I -B tools/sprint27/audit-public-miner.py evidence/sprint27/miner-comparison
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Sprint25 PostgreSQL preview permissions, revisions and dropped-client controls
        env:
          S25_QUALITY_DATABASE_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s25_quality_test_ci
          S25_QUALITY_EVIDENCE: .local/sprint25/ci-pg-http
        run: |
          python3 -c "from pathlib import Path; Path('.local/sprint25/ci-pg-http').mkdir(parents=True)"
          cargo test --locked --lib -- bpmn_quality_preview::tests::postgres_http_permissions_revisions_filtered_log_and_dropped_client --ignored --exact --nocapture --test-threads=1
      - name: Sprint26 durable quality and populated storage migration
        env:
          POSTGRES_CONTAINER: ${{ job.services.quality-postgres.id }}
          S26_QUALITY_DATABASE_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s26_quality_core_ci
          S26_QUALITY_EVIDENCE: .local/sprint26/ci-core
          S26_QUALITY_MIGRATION_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s26_quality_migration_ci
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U pi_s21_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pi_s26_quality_core_ci OWNER pi_s21_app;'
          docker exec "$POSTGRES_CONTAINER" psql -U pi_s21_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pi_s26_quality_migration_ci OWNER pi_s21_app;'
          mkdir -p .local/sprint26/ci-core
          cargo test --locked --lib -- quality_workflow::tests::postgres_durable_acceptance_cancellation_revocation_recovery_and_receipts --ignored --exact --nocapture --test-threads=1
          cargo test --locked --lib -- migration_v4::tests::populated_v3_upgrade_preserves_data_and_rejects_malformed_contracts --ignored --exact --nocapture --test-threads=1
          cargo run --locked -- --verify-quality-report .local/sprint26/ci-core/confirmed-report.json
      - name: Sprint28 durable discovery and populated storage migration
        env:
          POSTGRES_CONTAINER: ${{ job.services.quality-postgres.id }}
          S28_DISCOVERY_DATABASE_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s28_discovery_core_ci
          S28_DISCOVERY_EVIDENCE: .local/sprint28/ci-core
          S28_DISCOVERY_MIGRATION_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s28_discovery_migration_ci
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U pi_s21_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pi_s28_discovery_core_ci OWNER pi_s21_app;'
          docker exec "$POSTGRES_CONTAINER" psql -U pi_s21_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pi_s28_discovery_migration_ci OWNER pi_s21_app;'
          mkdir -p .local/sprint28/ci-core
          cargo test --locked --lib -- discovery_workflow::tests::postgres_durable_discovery_publication_retries_revocation_and_recovery --ignored --exact --nocapture --test-threads=1
          cargo test --locked --lib -- migration_v5::tests::populated_v4_upgrade_preserves_data_and_rejects_malformed_contracts --ignored --exact --nocapture --test-threads=1
      - name: Sprint28 public discovery evidence and numerical replay
        # Quota accounting has an explicit v6 barrier; historical migration fixtures
        # continue to test their own exact historical schema contracts.
        run: |
          mkdir -p .local/sprint28/ci-public-cases
          python3 -I -B tools/sprint28/audit-discovery-evidence.py evidence/sprint28/durable-discovery --emit-training-export .local/sprint28/derived-training-report.json
          python3 -I -B tools/sprint28/audit-discovery-evidence-tests.py evidence/sprint28/durable-discovery .local/sprint28/ci-public-cases
          cargo run --locked -- --verify-quality-report evidence/sprint28/durable-discovery/browser-original-report.json
          cargo run --locked -- --verify-quality-report evidence/sprint28/durable-discovery/browser-imported-report.json
          cargo run --locked -- --verify-quality-report .local/sprint28/derived-training-report.json
      - name: Sprint29 finite HTTP API compatibility contract
        env:
          S28_DISCOVERY_DATABASE_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s28_discovery_core_ci
          S29_OWNED_FIXTURE: 'yes'
        run: |
          timeout 300s bash tools/sprint29/run-api-contract-ci.sh
          python3 -I -B tools/sprint29/verify-api-evidence.py evidence/sprint29/api-contract
      - name: Sprint30 atomic project quota and populated v5 migration
        env:
          POSTGRES_CONTAINER: ${{ job.services.quality-postgres.id }}
          S30_QUOTA_DATABASE_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s30_quota_core_ci
          S30_QUOTA_EVIDENCE: .local/sprint30/ci-quota
          S30_QUOTA_MIGRATION_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s30_quota_migration_ci
          S30_QUOTA_MIGRATION_EVIDENCE: .local/sprint30/ci-migration
          S30_QUOTA_WORKFLOW_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s30_quota_workflow_ci
          S30_QUOTA_WORKFLOW_EVIDENCE: .local/sprint30/ci-workflow
          S30_QUOTA_RECOVERY_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s30_quota_recovery_ci
          S30_QUOTA_RECOVERY_EVIDENCE: .local/sprint30/ci-recovery
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U pi_s21_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pi_s30_quota_core_ci OWNER pi_s21_app;'
          docker exec "$POSTGRES_CONTAINER" psql -U pi_s21_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pi_s30_quota_migration_ci OWNER pi_s21_app;'
          docker exec "$POSTGRES_CONTAINER" psql -U pi_s21_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pi_s30_quota_workflow_ci OWNER pi_s21_app;'
          docker exec "$POSTGRES_CONTAINER" psql -U pi_s21_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pi_s30_quota_recovery_ci OWNER pi_s21_app;'
          mkdir -p .local/sprint30/ci-quota .local/sprint30/ci-migration .local/sprint30/ci-workflow
          cargo test --locked --lib -- project_quota::postgres_tests::postgres_quota_boundaries_rollback_replacement_terminal_and_concurrency --ignored --exact --nocapture --test-threads=1
          python3 -I -B tools/sprint30/audit-quota.py .local/sprint30/ci-quota/quota-records.json
          python3 -I -B tools/sprint30/verify-evidence.py evidence/sprint30/project-quota --self-test
          python3 -I -B tools/sprint31/verify-service-evidence.py evidence/sprint31/systemd-profile --self-test
          python3 -I -B tools/sprint32/verify-offline-evidence.py evidence/sprint32/offline-migration --self-test
          (cd evidence/sprint30/linux-ci && sha256sum --check --strict SHA256SUMS)
          (cd evidence/sprint30/quota-browser && sha256sum --check --strict SHA256SUMS)
          cargo test --locked --lib -- migration_v6::tests::populated_v5_full_accounting_repeat_and_malformed_refusals --ignored --exact --nocapture --test-threads=1
          cargo test --locked --lib -- quota_workflow_tests::postgres_all_workflows_close_after_quota_fill_and_start_revocation --ignored --exact --nocapture --test-threads=1
          mkdir -p .local/sprint30/ci-recovery
          cargo test --locked --lib -- quota_workflow_tests::postgres_queued_recovery_under_zero_quota_all_namespaces --ignored --exact --nocapture --test-threads=1
      - name: Sprint30 invalid HTTPS configuration refuses before database
        env:
          POSTGRES_CONTAINER: ${{ job.services.quality-postgres.id }}
          S30_ORIGIN_DATABASE_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s30_origin_ci
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U pi_s21_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pi_s30_origin_ci OWNER pi_s21_app;'
          python3 -I -B tools/sprint30/origin-startup-probe.py
      - name: Sprint30 Linux trusted TLS reverse proxy contract
        env:
          S28_DISCOVERY_DATABASE_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s28_discovery_core_ci
          S30_OWNED_TLS_FIXTURE: 'yes'
        run: |
          python3 -I -B tools/sprint30/port-guard-tests.py
          timeout 240s bash tools/sprint30/run-linux-tls-ci.sh
      - name: Sprint30 quota and saved report full PostgreSQL restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.quality-postgres.id }}
          S28_DISCOVERY_DATABASE_URL: postgresql://pi_s21_app:sprint25-ci-only@127.0.0.1:5432/pi_s28_discovery_core_ci
          S30_OWNED_QUOTA_DR: 'yes'
        run: timeout 180s bash tools/sprint30/run-quota-dr-ci.sh
      - name: Sprint25 shared BPMN evaluator replay and corruption controls
        run: |
          python3 -B tests/sprint25_quality_shared.py --output .local/sprint25/ci-shared-quality
          node tests/sprint25_quality_ui.cjs
          cargo run --locked --example bpmn_quality -- prepare fixtures/quality/corpus.json .local/sprint25/ci-fresh-prepared
          cargo run --locked --example bpmn_quality -- score .local/sprint25/ci-fresh-prepared .local/sprint25/ci-fresh-metrics.json
          python3 -B tools/sprint25/verify-quality-refactor.py --before evidence/sprint19/bpmn-quality/rust-metrics.json --before-prepared evidence/sprint19/bpmn-quality/prepared --after .local/sprint25/ci-fresh-metrics.json --after-prepared .local/sprint25/ci-fresh-prepared --reference evidence/sprint19/bpmn-quality/reference-metrics.json --output .local/sprint25/ci-fresh-audit.json
      - name: XES oracle provenance guards
        run: node tests/oracle_xes_tools.mjs
      - name: Service method provenance guards
        run: node tests/service-oracle-tools.mjs
      - name: Sprint16 fieldwise comparator and BPMN geometry regressions
        run: |
          node tests/full_service_comparator.mjs
          node tests/sprint16_bpmn_geometry.cjs
          mkdir -p .local/sprint16/service
          python3 tools/oracle/full-service-bootstrap-tests.py
      - name: Sprint18 public-service comparator regressions
        run: |
          node tests/public_service_comparator.mjs
          node tests/core_filter_comparator.mjs
          node tests/sprint18_bpmn_labels.cjs
          mkdir -p .local/sprint18
          node tools/oracle/compare-public-service.mjs --matrix evidence/sprint18/public-service/reference-index.json evidence/sprint18/public-service/rust-index.json .local/sprint18/public-comparison.json
          node tools/oracle/compare-core-filter.mjs evidence/sprint18/core-filter/java-index.json evidence/sprint18/core-filter/rust-index.json .local/sprint18/core-filter-comparison.json
          node -e "const r=require('./.local/sprint18/core-filter-comparison.json'); if(r.case_count!==8 || r.cases.some(c=>!c.all_frozen_hypotheses_match || (c.profile==='overlap' && c.overlap_fields_match!==true))) process.exit(1);"
      - name: Sprint18 finite Petri alignment evidence
        run: |
          mkdir -p .local/sprint18/alignment-tools
          python3 -B tools/oracle/verify-alignment-evidence.py evidence/sprint18/alignment-fitness
          python3 -B tests/alignment_evidence_tools.py --workroot .local/sprint18/alignment-tools
      - name: Sprint19 BPMN quality and independent saved-evidence audit
        run: |
          mkdir -p .local/sprint19/ci-temp .local/sprint19/ci-audit
          python3 -B tests/quality_graph_comparator.py
          python3 -B tests/quality_net_conservation.py
          TMPDIR="$PWD/.local/sprint19/ci-temp" python3 -B tests/sprint19_quality_di.py
          TMPDIR="$PWD/.local/sprint19/ci-temp" python3 -B tests/sprint19_schema_hint.py
          TMPDIR="$PWD/.local/sprint19/ci-temp" python3 -B tests/sprint19_quality_miner_project.py
          python3 -B tools/sprint19/verify-quality-manifest.py evidence/sprint19/miner-quality
          python3 -B tools/oracle/audit-quality-cohort.py --corpus fixtures/quality-miner/corpus.json --prepared evidence/sprint19/miner-quality/prepared --conversion evidence/sprint19/miner-quality/reference-conversion --rust evidence/sprint19/miner-quality/rust-metrics.json --reference evidence/sprint19/miner-quality/reference-metrics.json --output .local/sprint19/ci-audit/miner-audit.json
          python3 -B tools/sprint19/verify-core-projection.py evidence/sprint19/core-calendar
          python3 -B tools/sprint19/verify-core-projection.py evidence/sprint19/core-filter-extended
          node tools/oracle/compare-core-calendar.mjs evidence/sprint19/core-calendar/java-index.json evidence/sprint19/core-calendar/rust-index.json .local/sprint19/ci-audit/calendar.json
          node tools/oracle/compare-core-filter-extended.mjs evidence/sprint19/core-filter-extended/java-index.json evidence/sprint19/core-filter-extended/rust-index.json .local/sprint19/ci-audit/filter.json
          node -e "for (const [f,n] of [['calendar',13],['filter',8]]) { const r=require('./.local/sprint19/ci-audit/'+f+'.json'); if(r.case_count!==n || r.cases.length!==n || r.cases.some(c=>!c.all_frozen_hypotheses_match || (f==='calendar' ? c.main_equality_eligible && c.main_overlap_fields_match!==true : c.profile==='overlap' && c.overlap_fields_match!==true))) process.exit(1); }"
          node --test tools/oracle/compare-core-calendar.test.mjs tools/oracle/compare-core-filter-extended.test.mjs
          TMPDIR="$PWD/.local/sprint19/ci-temp" python3 -B tools/oracle/core-calendar-public-projection-tests.py
          python3 -B tools/sprint19/verify-quality-manifest.py evidence/sprint19/bpmn-quality
          python3 -B tools/oracle/audit-quality-evidence.py --rust evidence/sprint19/bpmn-quality/rust-metrics.json --reference evidence/sprint19/bpmn-quality/reference-metrics.json --prepared evidence/sprint19/bpmn-quality/prepared --corpus fixtures/quality/corpus.json --output .local/sprint19/ci-audit/independent-audit.json
      - name: Sprint20 conversions and saved SplitMiner measurements
        run: |
          mkdir -p .local/sprint20/ci
          python3 -B tools/sprint20/verify-evidence-manifest.py evidence/sprint20
          python3 -B tests/sprint20_evidence_manifest.py
          python3 -B tests/conversion_evidence_auditor.py
          python3 -B tools/oracle/audit-miner-performance-tests.py
          python3 -B tools/oracle/audit-miner-benchmark-evidence-tests.py
          python3 -B tools/sprint20/project-public-evidence-tests.py
          python3 -B tests/public_projection_independent.py
          python3 -B tools/oracle/audit-conversion-evidence.py --corpus fixtures/conversions/corpus.json --index evidence/sprint20/conversions/index.json --boundary-index evidence/sprint20/conversion-boundaries/index.json --output .local/sprint20/ci/conversion-audit.json
          python3 -B tests/conversion_evidence_counterfactuals.py --corpus fixtures/conversions/corpus.json --index evidence/sprint20/conversions/index.json --boundary-index evidence/sprint20/conversion-boundaries/index.json --output-directory .local/sprint20/ci/conversion-counterfactuals
          python3 -B tools/oracle/audit-miner-benchmark-evidence.py --corpus fixtures/oracle-miner-performance/corpus.json --index evidence/sprint20/miner-performance/index.json --public-projection evidence/sprint20/public-projection.json --output .local/sprint20/ci/miner-audit.json
          python3 -c "import json; r=json.load(open('.local/sprint20/ci/miner-audit.json')); assert r['status']=='COMPLETE_FROZEN_BENCHMARK_AND_CONDITIONAL_HISTORICAL_CARRY' and not r['errors'] and r['completed_call_rows']==64 and r['full_semantic_maps']==56"
      - name: Sprint21 conversion revisions and public evidence
        run: |
          mkdir -p .local/sprint21/ci
          node tests/sprint21_conversion_revisions.cjs
          python3 -B tests/sprint21_public_projection.py
          python3 -B tools/oracle/audit-conversion-evidence.py --corpus fixtures/conversions/corpus.json --index evidence/sprint21/conversions/index.json --boundary-index evidence/sprint21/conversion-boundaries/index.json --output .local/sprint21/ci/conversion-audit.json
          python3 -B tests/conversion_evidence_counterfactuals.py --corpus fixtures/conversions/corpus.json --index evidence/sprint21/conversions/index.json --boundary-index evidence/sprint21/conversion-boundaries/index.json --output-directory .local/sprint21/ci/conversion-counterfactuals
          python3 -B tools/oracle/audit-conversion-browser-evidence.py "$PWD" evidence/sprint21/browser .local/sprint21/ci/browser-audit.json
          python3 -B tools/oracle/audit-conversion-browser-evidence.py "$PWD" evidence/sprint21-capacity/browser .local/sprint21/ci/capacity-browser-audit.json
      - name: Sprint22 calendar evidence and bounded package controls
        run: |
          mkdir -p "$RUNNER_TEMP/sprint22-calendar-controls"
          python3 -I -B tools/sprint22-calendar/check-package-controls.py evidence/sprint22-calendar tools/sprint22-calendar "$RUNNER_TEMP/sprint22-calendar-controls" CA16825641A98A31D4DE0777371358D79711DD7A51663D5379A63ADBBD390573
      - name: Sprint22 calendar form saved HTTP audit
        run: |
          python3 -I -B tools/sprint22-calendar-form/audit-http.py evidence/sprint22-calendar-form/http-c02 evidence/sprint22-calendar-form/http-c03 "$RUNNER_TEMP/sprint22-calendar-form-audit.json"
      - name: Sprint23 compact reports and independent corpus audit
        run: |
          mkdir -p .local/sprint21/root/sprint23/ci-corpus .local/sprint21/root/sprint23/ci-corpus-audit .local/sprint21/root/sprint23/ci-corpus-controls
          cargo run --locked --example sprint23_corpus -- "$PWD/.local/sprint21/root/sprint23/ci-corpus"
          codec_sha=$(sha256sum src/conversion/compact.rs | cut -d ' ' -f 1)
          python3 -B tools/sprint23/audit-corpus.py "$PWD/.local/sprint21/root/sprint23/ci-corpus" "$PWD/.local/sprint21/root/sprint23/ci-corpus-audit" --auditor "$PWD/tools/sprint23/audit-compact.py" --oracle "$PWD/tools/oracle/audit-conversion-evidence.py" --corpus "$PWD/fixtures/conversions/corpus.json" --source-root "$PWD" --codec-sha "$codec_sha"
          python3 -B tools/sprint23/check-corpus-controls.py "$PWD/.local/sprint21/root/sprint23/ci-corpus" "$PWD/.local/sprint21/root/sprint23/ci-corpus-controls" --batch "$PWD/tools/sprint23/audit-corpus.py" --auditor "$PWD/tools/sprint23/audit-compact.py" --oracle "$PWD/tools/oracle/audit-conversion-evidence.py" --corpus "$PWD/fixtures/conversions/corpus.json" --source-root "$PWD" --codec-sha "$codec_sha"
          python3 -B tools/sprint23/check-compact-controls.py "$PWD/tools/sprint23/audit-compact.py" 048A57750159B49D20E3CCABB02ACB1A7C4320A1C676DAB1B91291CF7114B802 "$PWD/tools/oracle/audit-conversion-evidence.py" "$PWD/fixtures/conversions" "$PWD/.local/sprint21/root/sprint23/ci-codec-controls.json"
          python3 -B tools/sprint23/decode-report.py "$PWD/.local/sprint21/root/sprint23/ci-corpus/X01.compact.json" "$PWD/.local/sprint21/root/sprint23/ci-decoded-report.json" --codec-sha "$codec_sha"
            mkdir -p .local/sprint21/root/sprint23/ci-transport-controls
            python3 -I -B tools/sprint23/check-transport-controls.py "$PWD/tools/sprint23/evidence-transport.py" "$PWD/.local/sprint21/root/sprint23/ci-transport-controls" --workspace "$PWD" --auditor "$PWD/tools/sprint23/audit-compact.py"
            python3 -I -B tools/sprint23/evidence-transport.py verify "$PWD/evidence/sprint23" --workspace "$PWD" --selection-sha 0E723F7BE2B611F69B2851B19812848DEF54C5B4A3BEBA773232E31945DEB858 --auditor "$PWD/tools/sprint23/audit-compact.py"
            mkdir -p .local/sprint21/root/sprint23/ci-selfcheck-kit
            python3 -I -B tools/sprint23/check-selfcheck-kit.py "$PWD/evidence/sprint23-kit/checker-kit.zip" 020D9517DF44BF7EC5D97BD81945729FD71C2EA9E181900E1FBF6D4406BF1509 "$PWD/.local/sprint21/root/sprint23/ci-selfcheck-kit" --doc-sha 68836A12BB2A3F6D7058D4675795FC8418DAC497778C465A16851C182E71ADE2 --workspace "$PWD" --source "$PWD/fixtures/conversions/flat-unicode.xes" --default-report "$PWD/evidence/sprint23/corpus/X01.default.json" --compact-report "$PWD/evidence/sprint23/corpus/X01.compact.json" --payload "$PWD/evidence/sprint23/corpus/X01.payload"
      - name: Sprint24 finite saved API and operational evidence
        run: |
          mkdir -p .local/sprint24/ci/journal
          python3 -I -B tools/sprint24/check-journal.py --source tools/sprint24/current-api-http.py --out .local/sprint24/ci/journal
          pwsh -NoProfile -File tools/sprint24/runtime/ops-protocol-controls02.ps1 -Protocol "$PWD/tools/sprint24/runtime/ops-pg-protocol02.psm1" -ProtocolSha CC86649476F7B2D57926477519BC0FF66ABEC340F5D88A8D6C7C6DFCA74082CF -Output "$PWD/.local/sprint24/ci/pg-protocol.json"
          python3 -I -B tools/sprint24/check-saved.py evidence/sprint24/saved
          mkdir -p .local/sprint21/root/sprint24/ci-saved-controls
          python3 -I -B tools/sprint24/check-saved-controls.py --checker "$PWD/tools/sprint24/check-saved.py" --evidence "$PWD/evidence/sprint24/saved" --fixture "$PWD/.local/sprint21/root/sprint24/ci-saved-controls" --proof "$PWD/.local/sprint21/root/sprint24/ci-saved-controls-proof.json"
          python3 -I -B tools/sprint24/compare-recovery.py --controls
          python3 -I -B tools/sprint20/verify-evidence-manifest.py evidence/sprint24/dr-current
          mkdir -p .local/sprint21/root/sprint24/ci-backup-path
          pwsh -NoProfile -File tools/sprint24/backup-path-controls.ps1 -Source "$PWD/tools/database-backup.ps1" -SourceSha 368906C5D863B05F140BD6B502678D92023D590AABF3EBD22DDB65E152927B57 -Fixture "$PWD/.local/sprint21/root/sprint24/ci-backup-path"
          python3 -I -B tools/sprint20/verify-evidence-manifest.py evidence/sprint24/backup-path
      - name: Sprint23 saved SplitMiner scale evidence
        run: |
          mkdir -p .local/sprint21/root/sprint23/ci-miner-controls
