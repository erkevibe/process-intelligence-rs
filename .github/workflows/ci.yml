          node tests/sprint12-resource-oracle.cjs .local/sprint12/root/ci-resource
      - name: Sprint13 pure diagnostic regressions
        run: |
          node tests/sprint13_cleanup_boundary_regression.cjs
          node tests/sprint13_complete_post_regression.cjs
          mkdir -p .local/sprint13/root/ci-receipt .local/sprint13/root/ci-historical
          cargo test --locked --lib receipt_snapshot_digest_public_calibration -- --nocapture > .local/sprint13/root/ci-receipt/rust-calibration.stdout
          node tools/sprint13/receipt-regression.cjs .local/sprint13/root/ci-receipt .local/sprint13/root/ci-receipt/rust-calibration.stdout
          node tools/sprint13/historical-oracle-regression.cjs .local/sprint13/root/ci-historical
          cargo run --locked --example sprint13_recovery_exports -- --self-test
          pwsh -NoProfile -File tests/sprint13_phase_command_names.ps1
      - name: Sprint14 diagnostic source and deadline checks
        run: |
          pwsh -NoProfile -Command '& ./tests/sprint14_phase_command_names.ps1 -AdditionalFiles @("full-timeout-phase.ps1","restore-login-phase.ps1","small-holders-phase.ps1","futureclone-phase.ps1","resource-phase-budget.psm1","catalog-integration-phase.ps1","catalog-race-phase.ps1","catalog-import-phase.ps1","catalog-downgrade-phase.ps1","historical-write-phase.ps1","identity-denied-phase.ps1","browser-phase.ps1","full-lock2-hot-phase.ps1","check-profile-bindings.ps1")'
          pwsh -NoProfile -File tools/sprint14/launch-reviewed-phase.ps1 -SelfTest
          node --check tools/sprint14/sql5-stream-observer.cjs
          node --check tools/sprint14/cleanup-boundary-observer.cjs
          node --check tools/sprint14/restore-login-probe.cjs
          node --check tools/sprint14/catalog-integration-probe.cjs
          node --check tools/sprint14/catalog-race-probe.cjs
          node --check tools/sprint14/catalog-import-probe.cjs
          node --check tools/sprint14/historical-write-probe.cjs
          node --check tools/sprint14/historical-write-state.cjs
          node --check tools/sprint14/identity-denied-probe.cjs
          node --check tools/sprint14/browser-bootstrap.cjs
          node tests/sprint14_crlf_index.cjs .local/sprint14/root/ci-crlf
      - name: Sprint15 diagnostic epoch checks
        run: |
          pwsh -NoProfile -Command '& ./tests/sprint15_phase_command_names.ps1 -AdditionalFiles @("resource-phase-budget.psm1","catalog-race-phase.ps1","catalog-downgrade-phase.ps1","full-lock2-hot-phase.ps1","browser-phase.ps1","check-profile-bindings.ps1","prepare-profile.ps1","launch-reviewed-phase.ps1","assert-writer-quiescence.ps1","catalog-invalid-phase.ps1","full-lock2-lifecycle-phase.ps1","full-lock2-stream-phase.ps1","owned-public-entry-service.psm1","browser-public-phase.ps1","validate-public-readback.ps1","validate-public-readback-bounded.ps1","public-readback-phase.ps1")'
          pwsh -NoProfile -File tools/sprint15/launch-reviewed-phase.ps1 -SelfTest
          pwsh -NoProfile -File tools/sprint15/assert-writer-quiescence.ps1 -SelfTest
          # Linux predicates/file IO only; Windows sharing and AssertHot drive guard have native evidence.
          pwsh -NoProfile -File tests/sprint15_hot_lifecycle.ps1
          pwsh -NoProfile -File tests/sprint15_closed_stream.ps1 -FixtureDirectory "$RUNNER_TEMP/sprint15-closed-stream"
          node --check tools/sprint15/catalog-race-probe.cjs
          node --check tools/sprint15/browser-bootstrap.cjs
          node --check tools/sprint15/cleanup-boundary-observer.cjs
      - name: Build release and local health smoke
        run: |
          cargo build --locked --release
          cargo build --locked --release --example pi_convert
          PI_EPHEMERAL=1 target/release/process-intelligence-rs > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health > health.json; then break; fi
            sleep 0.2
          done
          grep -q '"status":"ready"' health.json
          python3 - <<'PY'
          import json,tomllib
          from pathlib import Path
          assert json.loads(Path('health.json').read_text())['version']==tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          PY
          mkdir -p dist
          cp target/release/process-intelligence-rs dist/
          cp target/release/examples/pi_convert dist/
          cp -r static fixtures dist/
          cp README.md LICENSE docs/DEPENDENCIES.json dist/
          cp docs/CONVERSIONS.md dist/
            mkdir -p dist/docs dist/tools/sprint23 dist/tools/oracle
          cp docs/COMPACT_REPORTS.md dist/docs/
            cp docs/SELF_CHECK_RU.md dist/docs/
          cp tools/sprint23/decode-report.py tools/sprint23/audit-compact.py dist/tools/sprint23/
            cp tools/oracle/audit-conversion-evidence.py dist/tools/oracle/
          cp docs/SPRINT_33_REPORT.md dist/CANDIDATE_STATUS.md
          cp docs/PROJECT_QUOTA_CONTRACT.md docs/LINUX_TLS_DEPLOYMENT.md docs/SPRINT_30_REPORT.md dist/docs/
          cp docs/*.md dist/docs/
          mkdir -p dist/deploy dist/evidence
          cp -r deploy/linux dist/deploy/
          cp -r tools/sprint30 dist/tools/
          cp -r tools/sprint31 dist/tools/
          cp -r tools/sprint32 dist/tools/
          cp -r tools/sprint33 dist/tools/
          cp -r evidence/sprint30 dist/evidence/
          cp -r evidence/sprint31 dist/evidence/
          cp -r evidence/sprint32 dist/evidence/
          cp -r evidence/sprint28 evidence/sprint29 dist/evidence/
          cp -r tools/sprint28 tools/sprint29 dist/tools/
          mkdir -p dist/tools/sprint23-miner dist/evidence
          cp tools/sprint23-miner/*.py dist/tools/sprint23-miner/
          cp tools/oracle/audit-miner-benchmark-evidence.py tools/oracle/audit-miner-performance.py dist/tools/oracle/
          cp -r evidence/sprint23-miner dist/evidence/
          cp docs/SPRINT_23_MINER_REPORT.md dist/docs/
          cp -r tools/sprint24 dist/tools/
          mkdir -p dist/tools/sprint20
          cp tools/sprint20/verify-evidence-manifest.py dist/tools/sprint20/
          cp -r evidence/sprint24 dist/evidence/
          cp docs/CAPACITY_DIAGNOSTIC.md docs/DATABASE_RECOVERY.md docs/SPRINT_24_REPORT.md dist/docs/
          cp docs/CURRENT_DATABASE_RESTORE.md docs/ENTERPRISE_QUOTA_PLAN.md dist/docs/
          cp docs/SPRINT_24_DR_REPORT.md dist/docs/
          cp docs/SPRINT_24_BACKUP_PATH_REPORT.md dist/docs/
          cp docs/DEVELOPMENT_PLAN.md docs/SHARED_BPMN_QUALITY.md docs/SPRINT_25_BASELINE_REPORT.md dist/docs/
          cp docs/QUALITY_JOBS_CONTRACT.md docs/SPRINT_26_REPORT.md dist/docs/
          mkdir -p dist/tools/sprint26
          cp tools/sprint26/capacity-diagnostic.sql dist/tools/sprint26/
          cp tools/database-backup.ps1 dist/tools/
          python3 - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          root=Path('dist')
          source_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          environment=dict(schema_version=1,source_commit=source_commit,system=platform.system(),machine=platform.machine(),glibc=os.confstr('CS_GNU_LIBC_VERSION'),os_release=Path('/etc/os-release').read_text(),rustc=subprocess.check_output(['rustc','--version'],text=True).strip())
          (root/'BUILD_ENVIRONMENT.json').write_text(json.dumps(environment,indent=2)+'\n')
          files=[]
          for p in sorted(root.rglob('*')):
              assert not p.is_symlink()
              if p.is_file():
                  raw=p.read_bytes()
                  files.append(dict(path=p.relative_to(root).as_posix(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()))
          value=dict(schema_version=1,source_commit=source_commit,files=files)
          (root/'PACKAGE_MANIFEST.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
          tar -czf process-intelligence-rs-linux.tar.gz -C dist .
          python3 -I -B tools/sprint30/verify-package.py process-intelligence-rs-linux.tar.gz "$RUNNER_TEMP/sprint30-extracted-package" .local/sprint30/ci-dr/after-report.json > .local/sprint30/package-verification.json
      - name: Preserve selected Sprint30 observations
