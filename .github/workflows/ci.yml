name: Rust contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: XES oracle provenance guards
        run: node tests/oracle_xes_tools.mjs
      - name: Service method provenance guards
        run: node tests/service-oracle-tools.mjs
      - name: Diagnostic protocol and state oracle regressions
        run: |
          node tests/sql5-cycle-regression.cjs
          node tests/cleanup-boundary-regression.cjs
          node tests/stock-state-compare-regression.cjs
          node tests/auth-delta-regression.cjs
          node tests/audit-retention-regression.cjs
      - name: Sprint12 lifecycle oracle regressions
        run: |
          node tests/sprint12-project-selector.cjs
          mkdir -p .local/sprint12/root/ci-folder .local/sprint12/root/ci-project .local/sprint12/root/ci-resource
          node tests/sprint12-folder-oracle.cjs .local/sprint12/root/ci-folder
          node tests/sprint12-project-oracle.cjs .local/sprint12/root/ci-project
          node tests/sprint12-resource-oracle.cjs .local/sprint12/root/ci-resource
      - name: Sprint13 pure diagnostic regressions
        run: |
          node tests/sprint13_cleanup_boundary_regression.cjs
          node tests/sprint13_complete_post_regression.cjs
          mkdir -p .local/sprint13/root/ci-receipt .local/sprint13/root/ci-historical
          cargo test --locked --lib receipt_snapshot_digest_public_calibration -- --nocapture > .local/sprint13/root/ci-receipt/rust-calibration.stdout
          node tools/sprint13/receipt-regression.cjs .local/sprint13/root/ci-receipt .local/sprint13/root/ci-receipt/rust-calibration.stdout
          node tools/sprint13/historical-oracle-regression.cjs .local/sprint13/root/ci-historical
          cargo run --locked --example sprint13_recovery_exports -- --self-test
          pwsh -NoProfile -File tests/sprint13_phase_command_names.ps1
      - name: Build release and local health smoke
        run: |
          cargo build --locked --release
          PI_EPHEMERAL=1 target/release/process-intelligence-rs > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health > health.json; then break; fi
            sleep 0.2
          done
          grep -q '"status":"ready"' health.json
          mkdir -p dist
          cp target/release/process-intelligence-rs dist/
          cp -r static fixtures dist/
          cp README.md LICENSE docs/DEPENDENCIES.json dist/
          cp docs/SPRINT_13_REPORT.md dist/CANDIDATE_STATUS.md
          tar -czf process-intelligence-rs-linux.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: process-intelligence-rs-linux
          path: process-intelligence-rs-linux.tar.gz
          if-no-files-found: error
          retention-days: 14
