            .local/sprint30/package-verification.json
            .local/sprint30/origin-startup-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: process-intelligence-rs-linux
          path: process-intelligence-rs-linux.tar.gz
